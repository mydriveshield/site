# DriveShield — Netlify Deployment Config
# Deploy: push repo to GitHub, connect to Netlify, set publish directory to root

[build]
  publish = "."

# Route all paths to relevant HTML files
# "/" is served by index.html automatically
[[redirects]]
  from = "/warranty-site.html"
  to   = "/"
  status = 301

[[redirects]]
  from = "/partners"
  to   = "/partners.html"
  status = 200

[[redirects]]
  from = "/partners/"
  to   = "/partners.html"
  status = 200

[[redirects]]
  from = "/confirmation"
  to   = "/confirmation.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
